<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="離線圖片、RAW 負片、影片、設計稿、PDF、文件與 3D 模型檢視工具；支援常見 JPG、JPEG、PNG、WEBP、GIF、BMP、SVG、HEIC、RAW、PSD、PDF、MP4、GLB、GLTF、OBJ、STL 等格式，所有檔案只在瀏覽器本機處理。">
  <title>圖片檢視</title>
  <style>:root { --bg:#080b10; --panel:#11161e; --line:#29313d; --line-strong:#3b4655; --text:#f5f7fa; --muted:#99a3b1; --blue:#36a3ff; --mint:#66f0c2; --amber:#ffbd4a; --coral:#ff6d67; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
body { font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }
button,input { font:inherit; } button { color:inherit; }
.app-shell { min-height:100vh; background:radial-gradient(circle at 16% -10%,#162a3d 0,transparent 28%),var(--bg); }
.topbar { min-height:74px; padding:12px 18px; border-bottom:1px solid var(--line); background:rgba(8,11,16,.94); display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:20; backdrop-filter:blur(12px); }
.brand { display:flex; align-items:center; gap:12px; min-width:0; }
.brand-mark { width:42px; height:42px; border:1px solid #3dafff; color:var(--blue); display:grid; place-items:center; font-size:13px; font-weight:900; letter-spacing:.12em; clip-path:polygon(0 0,100% 0,100% 76%,76% 100%,0 100%); background:#0d1b29; }
.brand h1 { margin:0; font-size:17px; letter-spacing:.04em; } .brand p { margin:4px 0 0; font-size:11px; color:var(--mint); }
.top-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.support-strip { height:32px; padding:7px 18px; display:flex; align-items:center; gap:12px; overflow-x:auto; overflow-y:hidden; white-space:nowrap; border-bottom:1px solid var(--line); background:#0d131b; color:#8f9ba9; font:10px ui-monospace,monospace; scrollbar-width:thin; }
.support-strip b { color:var(--amber); letter-spacing:.05em; }
.button { border:0; border-radius:6px; padding:10px 14px; font-size:13px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; transition:transform .15s,filter .15s,opacity .15s; }
.button:hover:not(:disabled) { filter:brightness(1.1); transform:translateY(-1px); } .button:disabled { opacity:.38; cursor:not-allowed; }
.button.blue { background:var(--blue); color:#04111d; } .button.amber { background:var(--amber); color:#1a1000; } .button.mint { background:var(--mint); color:#001b14; } .button.coral { background:var(--coral); color:#250200; } .button.outline { background:#1a212b; border:1px solid var(--line-strong); } .button.full { width:100%; }
.workspace { height:calc(100vh - 74px); min-height:620px; padding:12px; display:grid; grid-template-columns:minmax(420px,1fr) minmax(270px,.36fr) minmax(320px,.42fr); gap:10px; }
.panel { min-width:0; min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:linear-gradient(180deg,#121821,#0f141b); box-shadow:0 14px 32px rgba(0,0,0,.2); display:flex; flex-direction:column; }
.panel-heading { min-height:54px; padding:10px 13px; border-bottom:1px solid var(--line); background:#151b24; display:flex; align-items:center; justify-content:space-between; }
.panel-heading>div { display:flex; align-items:center; gap:10px; min-width:0; } .panel-heading h2 { margin:0; font-size:13px; letter-spacing:.12em; }
.section-number { display:grid; place-items:center; width:30px; height:28px; border-left:3px solid var(--blue); color:var(--blue); background:#112233; font:800 11px ui-monospace,monospace; }
.section-number.mint { border-color:var(--mint); color:var(--mint); background:#0f2922; } .section-number.coral { border-color:var(--coral); color:var(--coral); background:#2b171b; }
.viewer-heading .image-position { font:700 11px ui-monospace,monospace; color:var(--muted); }
.viewer-toolbar { min-height:45px; padding:7px 10px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:5px; overflow-x:auto; background:#0c1117; }
.viewer-toolbar button { min-width:34px; height:30px; padding:0 9px; border:1px solid var(--line-strong); border-radius:4px; background:#1b222c; font-size:12px; font-weight:700; white-space:nowrap; cursor:pointer; }
.viewer-toolbar button:hover { border-color:var(--blue); background:#172c3e; } .viewer-toolbar i { display:block; height:22px; width:1px; background:var(--line); margin:0 4px; } .zoom-readout { min-width:47px; text-align:center; font:700 11px ui-monospace,monospace; color:var(--mint); }
.image-stage { position:relative; flex:1; min-height:0; overflow:hidden; display:grid; place-items:center; user-select:none; touch-action:none; background-color:#0b0f14; background-image:linear-gradient(45deg,#121821 25%,transparent 25%),linear-gradient(-45deg,#121821 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#121821 75%),linear-gradient(-45deg,transparent 75%,#121821 75%); background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; }
.image-stage,.image-stage.pan-enabled,.image-stage.pan-enabled:active,.image-stage>img { cursor:crosshair; }
.support-strip { display:none !important; }
.color-readout { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; line-height:1.45; }
.color-readout .hex { color:#66f0c2; } .color-readout .rgb { color:#36a3ff; }
.color-readout .cmyk { color:#ff6d67; } .color-readout .hsv { color:#ffbd4a; }
.color-readout .hsl { color:#d79cff; }
#color-picker-readout { display:none; }
#color-picker-readout .hex { color:#66f0c2; } #color-picker-readout .rgb { color:#36a3ff; }
#color-picker-readout .cmyk { color:#ff6d67; } #color-picker-readout .hsv { color:#ffbd4a; }
#color-picker-readout .hsl { color:#d79cff; }
.image-stage>img { max-width:calc(100% - 42px); max-height:calc(100% - 42px); width:auto; height:auto; object-fit:contain; transform-origin:center; transition:transform .08s ease-out; box-shadow:0 6px 34px rgba(0,0,0,.48); }
.viewer-toolbar button:disabled { opacity:.32; cursor:not-allowed; border-color:var(--line); }
.mode-pill { margin-left:auto; padding:4px 7px; border:1px solid #35485b; border-radius:3px; color:var(--amber); background:#171a19; font:800 9px ui-monospace,monospace; white-space:nowrap; }
.pdf-viewer { width:calc(100% - 22px); height:calc(100% - 22px); border:1px solid #3b4655; border-radius:4px; background:white; }
.video-viewer { width:calc(100% - 28px); height:calc(100% - 28px); object-fit:contain; background:#030507; border:1px solid #34404d; box-shadow:0 8px 34px #000a; }
.model-host { position:absolute; inset:0; overflow:hidden; cursor:grab; background:radial-gradient(circle at 50% 30%,#213142 0,#0b1016 62%); }
.model-host:active { cursor:grabbing; }
.model-host canvas { display:block; width:100%; height:100%; outline:none; }
.cpu-model-host { touch-action:none; }
.cpu-badge { position:absolute; top:10px; right:10px; z-index:3; padding:6px 8px; border:1px solid #346a5b; border-radius:4px; background:rgba(7,24,20,.88); color:var(--mint); font:800 9px ui-monospace,monospace; pointer-events:none; }
.model-status { position:absolute; inset:0; z-index:2; display:grid; place-items:center; padding:30px; color:#cfd9e6; text-align:center; font-size:12px; background:rgba(8,12,17,.82); }
.empty-state { width:min(520px,86%); padding:30px; text-align:center; border:1px dashed #3c4858; border-radius:8px; background:rgba(9,13,18,.84); }
.empty-state h3 { margin:18px 0 7px; font-size:17px; } .empty-state p { margin:0 0 14px; color:var(--muted); font-size:13px; } .empty-state small { display:block; color:#707b89; font-size:10px; line-height:1.6; }
.empty-state.unsupported strong { display:inline-block; color:var(--amber); border:1px solid #725a26; padding:8px 11px; margin-bottom:14px; }
.drop-graphic { height:54px; display:flex; justify-content:center; align-items:end; gap:7px; } .drop-graphic span { display:block; width:52px; height:42px; border:1px solid #405063; background:linear-gradient(140deg,#18314a,#16202b); transform:rotate(-7deg); } .drop-graphic span:nth-child(2) { height:52px; transform:translateY(3px); border-color:var(--blue); } .drop-graphic span:nth-child(3) { transform:rotate(7deg); }
.drop-overlay { position:fixed; inset:12px; z-index:100; border:2px dashed var(--mint); border-radius:10px; background:rgba(6,29,23,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--mint); pointer-events:none; box-shadow:inset 0 0 90px rgba(102,240,194,.08); } .drop-overlay b { font-size:22px; } .drop-overlay span { color:#b7fbe3; font-size:12px; }
.viewer-footer { min-height:34px; padding:7px 11px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:10px; background:#0c1117; } .viewer-footer span:first-child { color:#d8dde5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.info-scroll { min-height:0; overflow:auto; scrollbar-color:#354253 #11161e; } .info-group { padding:13px 14px 4px; } .info-group+.info-group { border-top:1px solid var(--line); margin-top:8px; }
.info-group h3,.batch-box h3 { margin:0 0 8px; color:var(--mint); text-transform:uppercase; letter-spacing:.16em; font-size:10px; } .info-group dl { margin:0; }
.info-row { display:grid; grid-template-columns:82px minmax(0,1fr); gap:10px; min-height:30px; align-items:start; padding:6px 0; border-bottom:1px solid #202731; font-size:11px; } .info-row dt { color:#788392; } .info-row dd { margin:0; text-align:right; color:#e4e8ed; line-height:1.45; overflow-wrap:anywhere; } .info-row dd.accent-value { color:var(--amber); font-weight:900; }
.info-note { margin:12px 14px 20px; border-left:3px solid var(--amber); padding:9px 11px; background:#211b10; color:#d5c39d; font-size:10px; line-height:1.6; } .side-empty { margin:auto; max-width:240px; padding:24px; text-align:center; color:var(--muted); font-size:12px; line-height:1.8; } .side-empty.compact { margin:18px auto; }
.library-heading strong { color:var(--coral); font:900 12px ui-monospace,monospace; } .list-actions { min-height:39px; padding:7px 11px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:#0c1117; } .check-all { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; } input[type=checkbox] { accent-color:var(--blue); } .list-actions button { border:0; background:transparent; color:var(--coral); font-size:11px; cursor:pointer; } .list-actions button:disabled { opacity:.35; cursor:not-allowed; }
.image-list { flex:1; min-height:130px; overflow:auto; padding:7px; scrollbar-color:#354253 #11161e; } .image-item { min-height:65px; padding:7px; margin-bottom:5px; display:grid; grid-template-columns:19px 49px minmax(0,1fr) 22px; align-items:center; gap:7px; border:1px solid transparent; border-radius:5px; background:#151b23; cursor:pointer; } .image-item:hover { border-color:#374354; } .image-item.active { border-color:var(--blue); background:#142435; box-shadow:inset 3px 0 var(--blue); }
.thumb { width:49px; height:49px; display:grid; place-items:center; overflow:hidden; background:#080b10; border:1px solid #303946; color:var(--amber); font:800 9px ui-monospace,monospace; } .thumb img { width:100%; height:100%; object-fit:cover; }
.item-copy { min-width:0; position:relative; padding-top:10px; } .item-index { position:absolute; top:-2px; left:0; color:#627080; font:800 8px ui-monospace,monospace; } .rename-line { display:flex; align-items:center; min-width:0; } .rename-line input { min-width:0; width:100%; padding:2px 4px; border:1px solid transparent; outline:0; background:transparent; color:#f2f5f8; font-size:11px; font-weight:700; } .rename-line input:focus { border-color:var(--blue); background:#080c11; } .rename-line span { color:#8491a0; font-size:10px; } .item-copy small { display:block; margin:4px 4px 0; color:#74808d; font-size:9px; } .remove-one { width:22px; height:28px; border:0; border-radius:3px; background:transparent; color:#75808e; font-size:18px; cursor:pointer; } .remove-one:hover { background:#3a191b; color:var(--coral); }
.batch-box { flex:0 0 auto; padding:11px; border-top:1px solid var(--line); background:#121820; } .batch-box p { margin:-3px 0 8px; color:var(--muted); font-size:9px; } .batch-fields { display:grid; grid-template-columns:1fr 60px 54px; gap:6px; } .batch-fields label { color:#7e8996; font-size:9px; } .batch-fields input { width:100%; height:29px; margin-top:3px; padding:5px 7px; border:1px solid var(--line-strong); border-radius:3px; outline:none; background:#090d12; color:white; font-size:11px; } .batch-fields input:focus { border-color:var(--mint); } .batch-preview { margin:7px 0; padding:6px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:#0b1016; color:#8c98a6; font:9px ui-monospace,monospace; }
.export-box { flex:0 0 auto; padding:10px; border-top:1px solid var(--line); display:grid; grid-template-columns:.8fr 1.2fr; gap:7px; background:#0c1117; }
.loading-toast,.notice-toast { position:fixed; left:50%; bottom:22px; z-index:30; transform:translateX(-50%); padding:11px 15px; border:1px solid #35536a; border-radius:6px; background:#102232; box-shadow:0 8px 30px #0009; color:#ddebfa; font-size:12px; display:flex; gap:9px; align-items:center; }
.notice-toast { z-index:31; border-color:#765d26; background:#2a210f; color:#ffe2a4; }
.loading-toast span { width:12px; height:12px; border:2px solid #48657b; border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
@media (max-width:1180px) { .workspace { height:auto; min-height:calc(100vh - 74px); grid-template-columns:minmax(430px,1fr) minmax(290px,.52fr); align-items:stretch; } .viewer-panel,.info-panel { min-height:650px; } .library-panel { grid-column:1/-1; min-height:560px; } .image-list { max-height:330px; } }
@media (max-width:760px) { .topbar { position:static; align-items:flex-start; flex-direction:column; } .top-actions { width:100%; } .top-actions .button { flex:1; } .workspace { height:auto; display:flex; flex-direction:column; padding:7px; } .viewer-panel { min-height:68vh; } .info-panel,.library-panel { min-height:580px; } .viewer-footer span:last-child { display:none; } .export-box { grid-template-columns:1fr; } }
@media (max-width:430px) { .viewer-toolbar i { display:none; } .viewer-toolbar { padding-inline:6px; } .viewer-toolbar button { padding:0 7px; } .empty-state { padding:20px 12px; } }
</style>
</head>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const observer = new MutationObserver(setupCustomFeatures);
  observer.observe(document.body, { childList:true, subtree:true });
  setupCustomFeatures();

  function setupCustomFeatures() {
    if (!window.customKeyboardNavAdded) {
      document.addEventListener('keydown', e => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return;
        const activeItem = document.querySelector('.image-item.active');
        if (!activeItem) return;
        const target = e.key === 'ArrowUp' ? activeItem.previousElementSibling : activeItem.nextElementSibling;
        if (target?.classList.contains('image-item')) {
          e.preventDefault();
          target.click();
          target.scrollIntoView({block:'nearest'});
        }
      });
      window.customKeyboardNavAdded = true;
    }

    const imageStage = document.querySelector('.image-stage');
    if (imageStage && !imageStage.dataset.colorPickerAdded) {
      imageStage.dataset.colorPickerAdded = 'true';
      imageStage.addEventListener('click', function(e) {
        const img = this.querySelector('img');
        if (!img) return;
        const rect = img.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if (x < 0 || x > rect.width || y < 0 || y > rect.height) return;
        const imageX = Math.min(img.naturalWidth - 1, Math.max(0, Math.floor(x / rect.width * img.naturalWidth)));
        const imageY = Math.min(img.naturalHeight - 1, Math.max(0, Math.floor(y / rect.height * img.naturalHeight)));
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1;
        const ctx = canvas.getContext('2d', {willReadFrequently:true});
        try {
          ctx.drawImage(img, imageX, imageY, 1, 1, 0, 0, 1, 1);
          const pixel = ctx.getImageData(0, 0, 1, 1).data;
          const r=pixel[0], g=pixel[1], b=pixel[2];
          const hex='#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1).toUpperCase();
          const rp=r/255, gp=g/255, bp=b/255, max=Math.max(rp,gp,bp), min=Math.min(rp,gp,bp), delta=max-min;
          const k=1-max, c=(1-rp-k)/(1-k)||0, m=(1-gp-k)/(1-k)||0, yc=(1-bp-k)/(1-k)||0;
          let h=0;
          if(delta!==0){if(max===rp)h=60*(((gp-bp)/delta)%6);else if(max===gp)h=60*((bp-rp)/delta+2);else h=60*((rp-gp)/delta+4);}
          if(h<0)h+=360; h=Math.round(h);
          const v=Math.round(max*100), sHsv=Math.round((max===0?0:delta/max)*100), l=(max+min)/2;
          const sHsl=Math.round((delta===0?0:delta/(1-Math.abs(2*l-1)))*100), lHsl=Math.round(l*100);
          const brandP=document.querySelector('.brand p');
          if(brandP){
            brandP.innerHTML=`<span style="color:#f39c12">HEX: ${hex}</span> | <span style="color:#3498db">RGB: ${r}, ${g}, ${b}</span> | <span style="color:#e74c3c">CMYK: ${Math.round(c*100)}%, ${Math.round(m*100)}%, ${Math.round(yc*100)}%, ${Math.round(k*100)}%</span> | <span style="color:#2ecc71">HSV: ${h}°, ${sHsv}%, ${v}%</span> | <span style="color:#9b59b6">HSL: ${h}°, ${sHsl}%, ${lHsl}%</span>`;
            brandP.style.cssText='display:block;color:#aaa;font-size:12px';
          }
        } catch(err) { console.error('取色失敗',err); }
      });
    }

    const imageList=document.querySelector('.image-list');
    if(imageList && !imageList.dataset.titleUpdaterAdded){
      imageList.dataset.titleUpdaterAdded='true';
      imageList.addEventListener('click', e => {
        const item=e.target.closest('.image-item');
        if(!item)return;
        const input=item.querySelector('.rename-line input');
        const ext=item.querySelector('.rename-line span');
        const heading=document.querySelector('.viewer-heading h2');
        if(heading)heading.textContent=`檔案檢視：${input?.value||'未命名檔案'}${ext?.textContent||''}`;
      });
    }
  }
});
</script>
</body>
</html>
